name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'site/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # Path the site is served from. Repo variable VITE_BASE overrides it
          # ("/" for a custom domain at root); otherwise the project-site /<repo>/.
          VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
          # Which club "/" opens (repo variable; defaults to stanmore in code).
          VITE_DEFAULT_CLUB: ${{ vars.VITE_DEFAULT_CLUB }}
          # Point the SPA at your deployed backend. Set repo variable VITE_API_URL
          # (Settings > Secrets and variables > Actions > Variables) e.g.
          # https://your-backend.azurewebsites.net/api/v1
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      # Assemble the Pages site. An optional top-level `site/` folder (a club's own
      # static website) forms the root, and the app goes in the APP_DIR repo
      # variable's subfolder (unset → root). Keep VITE_BASE in step: APP_DIR
      # "rankings" ↔ VITE_BASE "/rankings/".
      - name: Assemble site
        working-directory: .
        env:
          APP_DIR: ${{ vars.APP_DIR }}
        run: |
          mkdir -p "_site/$APP_DIR"
          if [ -d site ]; then cp -r site/. _site/; fi
          cp -r frontend/dist/. "_site/$APP_DIR"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
